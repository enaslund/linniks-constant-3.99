automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >
        Lean 4 with Mathlib v4.35.0-rc3, built with Lake; the agent wrote the definitions,
        statements and proofs, compiled them, and ran the local checks (scripts/verify.sh, the
        stand-in comparison scripts/Compare.lean, leanchecker replay, and the Lean FRO Comparator).
      prompting_notes: >
        Work under human direction in a research repository: the human set the goals (formalize
        the graded near lemma and the certificate checker of the project's proof, then prepare the
        package for Palomar) and the working rules; the agent chose the statements and proofs.
  notes: >
    The mathematical argument and the paper were also developed by AI systems under human
    direction (Anthropic's Claude Opus 5.5 and OpenAI's GPT Astra 6; the author reports that
    xAI's Grok contributed to formalization work elsewhere in the project). The formalization found one missing hypothesis of the informal argument (both row
    relaxations of the checker need nonnegative family counts), which the certificate builders
    already assert.

fidelity:
  divergences: >
    Relative to the paper's Theorem 8.4: the pair excess e_j is defined from the exact Gram
    values of all same-character partners (the paper bounds it by constants c^hi, which this
    implies); entry heights satisfy |gamma_j| <= T <= (log q)/3; the safe-anchor hypothesis is the
    zero-free statement SafeAnchor q s1 (2T+1) for all zeros; NearData.Valid requires a uniform
    positive lower bound for omega where f is nonzero, and I_B > 0. Burgess enters as printed for
    primitive characters and the non-principal form is derived. The checker accepts a superset of
    what the replay's checker (computations/graded/graded_cert.py in the research repository) accepts (it omits input assertions that soundness does
    not need), and requires nonnegative family counts.

review:
  status: "agent-reviewed"
  reviewers: ["independent Claude (Anthropic) review sessions"]
  notes: >
    Independent AI reviews (2026-09-29) audited the Challenge statements against the printed
    sources (Heath-Brown 1992 and Xylouris 2011, page by page) and the leaf-level statements
    against the builders' code, and found no soundness problem; their scope findings were fixed
    (recorded in the research repository, research/notes/leaf-formalization-2026-09-29.md,
    section 5). No human has reviewed the
    statements or the underlying mathematics.

acknowledgements: >
  Mathlib; the Lean FRO Comparator (leanprover/comparator), used locally to check the package.
