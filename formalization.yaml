status:
  scope: >
    The graded near lemma with its zero form (the response lemma, the threshold form, the entry
    bounds of the rows and the builders' normalization), and the soundness of the exact checker of
    the leaf-LP certificates with the bridge from the threshold form to the LP rows. The rest of the
    Linnik-constant argument (zero location, the case tree, the exterior regimes and the reduction to
    the theorem) is not part of this formalization. The repository also proves results that are not
    compared: seven kernel-checked certificates, a native checker proved equal to the verified one,
    what a certified leaf proves about primes (from Xylouris (3.57) and Lemma 5.1, stated as
    printed), verified enclosures of the leaf data, Heath-Brown's Conditions 1-2 for the
    parabolic autocorrelation tests, and a native checker of the leaves' near rows proved sound
    (each row a concrete instance of the near lemma, including the family terms that keep a
    second zero), composed with the leaf theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "GradedNear.graded_near_lemma"
      file: "GradedNear/Statement.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies:
        - statement: "Xylouris, Lemma 3.1 (principal prime sums)"
          source: "Xylouris 2011"
        - statement: "Xylouris, Lemma 3.2 (local explicit formula), with phi <= 1/3"
          source: "Xylouris 2011"
        - statement: "Burgess's bound, k = 3, for primitive characters (Heath-Brown, Lemma 2.1)"
          source: "Heath-Brown 1992; Burgess 1963"
        - statement: "Graham's estimate for Selberg-sieve sums (Heath-Brown, (11.13), U = 1)"
          source: "Heath-Brown 1992; Graham 1978"
    - declaration: "GradedNear.graded_near_threshold"
      file: "GradedNear/ZeroForm.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies:
        - statement: "the four inputs of graded_near_lemma"
          source: "Xylouris 2011; Heath-Brown 1992"
    - declaration: "GradedNear.builder_threshold"
      file: "GradedNear/Builder.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies:
        - statement: "the four inputs of graded_near_lemma"
          source: "Xylouris 2011; Heath-Brown 1992"
    - declaration: "GradedNear.Cert.checkLeaf_sound"
      file: "GradedNear/Cert/Sound.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
