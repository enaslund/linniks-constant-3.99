# Palomar's complete mechanical preflight, run from this repository on a GitHub-hosted runner.
# It calls Palomar's own reusable workflow in `mode: full`, pinned (workflow reference and
# `pipeline_commit`) to the same full PalomarSubmission commit, with the hosted execution
# profile. Palomar requires `status: pass` in the uploaded mechanical report before submission.
# Dispatch it on the exact commit to be submitted (Actions tab, or
# `gh workflow run palomar-preflight.yml --ref master`).
name: Palomar preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: preflight-${{ github.run_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
